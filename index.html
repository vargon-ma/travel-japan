<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เที่ยวญี่ปุ่น — ร้านและสถานที่แนะนำ</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
  </head>
  <body>
    <header class="hero">
      <h1>เที่ยวญี่ปุ่น</h1>
      <p class="hero__subtitle">รวมร้านและสถานที่แนะนำสำหรับนักท่องเที่ยวสายเกม อนิเมะ และของกิน</p>
    </header>

    <main class="container">
      <p id="rate-label" class="rate-label" aria-live="polite" hidden></p>

      <section class="filters" aria-label="ตัวกรองและค้นหา">
        <div class="filters__row">
          <label class="filters__field">
            <span class="filters__label">หมวด</span>
            <select id="filter-category">
              <option value="">ทุกหมวด</option>
            </select>
          </label>
          <label class="filters__field">
            <span class="filters__label">เมือง</span>
            <select id="filter-city">
              <option value="">ทุกเมือง</option>
            </select>
          </label>
          <label class="filters__field filters__field--search">
            <span class="filters__label">ค้นหา</span>
            <input
              id="filter-search"
              type="search"
              placeholder="ชื่อร้าน สถานที่ หรือสินค้า…"
              autocomplete="off"
            />
          </label>
          <div class="filters__field">
            <span class="filters__label">เรียงราคา</span>
            <div class="sort" role="group" aria-label="เรียงตามราคา">
              <button type="button" class="sort__btn" data-direction="asc" aria-pressed="false">
                ถูก→แพง
              </button>
              <button type="button" class="sort__btn" data-direction="desc" aria-pressed="false">
                แพง→ถูก
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="grid-status" class="status" aria-live="polite">กำลังโหลดข้อมูล…</section>
      <section id="card-grid" class="card-grid" aria-label="รายการร้านและสถานที่"></section>
    </main>

    <div id="modal" class="modal" hidden>
      <div class="modal__backdrop" data-modal-close></div>
      <div
        class="modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        tabindex="-1"
      >
        <button type="button" class="modal__close" data-modal-close aria-label="ปิด">✕</button>
        <div id="modal-body" class="modal__body"></div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
